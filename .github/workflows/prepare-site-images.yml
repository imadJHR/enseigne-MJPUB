name: Optimize MJ PUB site images

on:
  push:
    branches: [client-modifs-images-ia-20261119]
    paths:
      - "scripts/prepare-site-images.mjs"
      - ".github/workflows/prepare-site-images.yml"
      - "app/page.tsx"
      - "app/brand.css"
      - "scripts/audit-responsive.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Enhance referenced site images and rewrite display paths
        run: node scripts/prepare-site-images.mjs
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Verify lint
        run: npm run lint
      - name: Verify production build
        run: npm run build
      - name: Install headless Chromium for real responsive testing
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Test homepage and customer journeys at 10 viewport widths
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/mjpub-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for n in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/; then break; fi
            sleep 2
          done
          node scripts/audit-responsive.mjs
      - name: Upload screenshots and responsive audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mjpub-responsive-review
          path: artifacts/responsive/
          if-no-files-found: warn
      - name: Commit display assets to the pull-request branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/optimized app components data lib
          if ! git diff --cached --quiet; then
            git commit -m "Upscale and optimize all referenced MJ PUB visuals"
            git push origin "HEAD:client-modifs-images-ia-20261119"
          fi
